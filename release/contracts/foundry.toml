[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# REMAPPINGS ARE PINNED AND AUTO-DETECTION IS OFF (D-052(b), round six, five lenses).
#
# THE ARGUMENT: the compiled bytecode must not depend on HOW the libraries happen to be mounted.
# solc records `settings.remappings` in the metadata, whose hash is the CBOR trailer of the
# deployed bytecode — so the remapping LIST is an input to `targetCodeHash`, which every mandate
# binds and all 50 committed corpus views carry.
#
# WHAT WENT WRONG. Only two of the five were declared here; forge auto-detected the other three
# by walking `lib/`. `session-state.md` §1 step 1 told every review worktree to SYMLINK
# `contracts/lib/*` — and through a symlink the walk does not find OpenZeppelin's own nested
# `remappings.txt`, so it resolved FOUR entries instead of five, omitting
# `@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/`. Different metadata, different
# trailer, different code hash, and all 50 view digests mismatched. The deep gate therefore could
# not pass in a worktree provisioned exactly as the handoff prescribed — while D-050(1) made
# running the deep profile a CONDITION of a valid review round, and the round-six brief recorded
# the blocker as "SOLVED". A-066 solved the socket half; this is the other half.
#
# Reproduced in both directions on a clean rebuild: symlinked libs -> 4 remappings and a
# different DemoPay bytecode; real directories -> 5 and byte-identical to the live tree. The two
# builds agree for their first 617 bytes and differ only in the metadata digest.
#
# THE FIX IS TO PIN, NOT TO PRESCRIBE A PROVISIONING METHOD. Telling reviewers to use real
# checkouts is a procedure, and a procedure that must be remembered is the thing that failed.
# `auto_detect_remappings = false` plus the full explicit list makes the build a function of
# committed configuration alone. NOTE that a `remappings.txt` does NOT achieve this — forge
# merges auto-detected entries on top of it regardless, which round six measured.
#
# The list below is byte-for-byte what the live tree auto-detected, in solc's own order, so the
# committed artifacts and every view digest are unchanged. Verified: bytecode identical before
# and after this change, and identical from a symlinked worktree.
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "forge-std/=lib/forge-std/src/",
    "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# MandatePayload has 17 fields, so a single abi.encode of typehash + members exceeds the
# legacy pipeline's stack. The alternative — splitting the encode into concatenated chunks
# — is hash-identical in theory but puts the correctness of every signature in the repo on
# a hand-proof. The IR pipeline keeps the encoding a single literal abi.encode.
via_ir = true

# Sentinel is a security lab: warnings are defects, not noise.
deny = "warnings"

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Deeper campaign for gate evidence: `forge test --profile gate`
#
# THE GATE PROFILE IS SEEDED AND THE DEFAULT IS NOT, and the split is the point.
#
# An independent review observed that with no seed anywhere, any mutation whose only killer
# is an invariant is a single sample from a random process — so "0 survived" is not
# reproducible by construction, and neither is a gate result. That is the wrong property for
# EVIDENCE. It is the right property for DEVELOPMENT: an unseeded default explores new
# sequences on every run, which is how a stateful campaign finds what nobody thought of.
#
# So the default profile stays unseeded and keeps exploring, and the gate profile pins a seed.
#
# WHAT THE SEED ACTUALLY BUYS, MEASURED RATHER THAN ASSUMED — because the first version of
# this comment claimed "a figure cited at S2 can be reproduced by anyone with the repository"
# and that is not what two runs showed. Running the gate profile twice back to back:
#
#   * every test outcome identical (66/66 pass both times)
#   * every `runs:` and `calls:` figure identical (2048 / 262144 on every invariant)
#   * revert tallies identical on 8 of 10 invariants, and off by ONE on two of them
#     (154 vs 153 on nonceEqualsSuccessfulExecutions and tamperedAttemptsNeverExecute)
#
# So seeding pins the campaign's SHAPE and its outcomes, and does not make it bit-identical.
# Something outside the fuzz seed — most likely the runner's scheduling across invariants —
# still moves. The honest claim is therefore: a gate figure quoted from this profile is
# reproducible as a PASS/FAIL and as a call count, and a revert tally quoted to the unit is
# not. Do not cite a revert tally as if it were.
#
# It also bounds, without settling, the review hypothesis this was written for. A mutation's
# caught/survived verdict is a pass/fail outcome, and pass/fail reproduced exactly across the
# two runs measured — but two runs is two runs, and a mutation killed only by a rare sequence
# could still flip. "0 survived" is better founded than it was and is not proven deterministic.
#
# The seed is arbitrary and has no meaning; it is fixed so that it is fixed.
[profile.gate.fuzz]
runs = 20000
seed = "0x53656e74696e656c"

[profile.gate.invariant]
runs = 2048
depth = 128

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
