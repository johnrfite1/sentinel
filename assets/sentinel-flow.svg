<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="584" viewBox="0 0 1080 584" role="img" aria-labelledby="title description">
  <title id="title">Sentinel: from intent to exact execution</title>
  <desc id="description">An untrusted agent proposes a call. The evaluator compares decoded arguments and simulated effects with an owner-signed mandate. An isolated signer attests a receipt. SentinelVault checks the exact bytes and execution conditions. ALLOW can execute automatically; REVIEW requires a separate owner-signed override; BLOCK reverts on both paths. Only the evaluator decodes calldata arguments. This is a testnet lab with no cumulative-loss or onchain token-allowance cap.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#67e8f9" stroke-width="2"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 650; fill: #f1f5f9; }
      .heading { font-size: 22px; font-weight: 650; fill: #f1f5f9; }
      .body { font-size: 18px; fill: #cbd5e1; }
      .label { font-size: 15px; font-weight: 650; letter-spacing: 1.2px; fill: #67e8f9; }
      .flow { fill: none; stroke: #67e8f9; stroke-width: 2; marker-end: url(#arrow); }
      .card { fill: #152333; stroke: #7a91aa; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1080" height="584" rx="18" fill="#0b1522"/>
  <path d="M32 29h30v30H32z M40 37h14v14H40z M27 64l40-40" fill="none" stroke="#67e8f9" stroke-width="2"/>
  <text x="82" y="52" class="title">From intent to exact execution</text>
  <text x="32" y="90" class="body">One proposed EVM call. One human-signed mandate. An inspectable decision.</text>
  <rect x="296" y="121" width="488" height="89" rx="10" class="card"/>
  <text x="316" y="150" class="label">OWNER-SIGNED MANDATE</text>
  <text x="316" y="180" class="body">The authorized purpose, call constraints and signer</text>
  <path d="M408 210v44" class="flow"/>
  <rect x="32" y="260" width="224" height="161" rx="10" class="card"/>
  <text x="50" y="287" class="label">01 / PROPOSE</text>
  <text x="50" y="321" class="heading">Untrusted agent</text>
  <text x="50" y="352" class="body">Target, value</text>
  <text x="50" y="378" class="body">and calldata</text>
  <path d="M256 340h34" class="flow"/>
  <rect x="296" y="260" width="224" height="161" rx="10" class="card"/>
  <text x="314" y="287" class="label">02 / EVALUATE</text>
  <text x="314" y="321" class="heading">Evaluator</text>
  <text x="314" y="352" class="body">Decoded arguments</text>
  <text x="314" y="378" class="body">+ simulated effects</text>
  <path d="M520 340h34" class="flow"/>
  <rect x="560" y="260" width="224" height="161" rx="10" class="card"/>
  <text x="578" y="287" class="label">03 / ATTEST</text>
  <text x="578" y="321" class="heading">Isolated signer</text>
  <text x="578" y="352" class="body">Signed verdict</text>
  <text x="578" y="378" class="body">+ evidence binding</text>
  <path d="M784 340h34" class="flow"/>
  <rect x="824" y="260" width="224" height="161" rx="10" class="card"/>
  <text x="842" y="287" class="label">04 / CHECK EXECUTION</text>
  <text x="842" y="321" class="heading">SentinelVault</text>
  <text x="842" y="352" class="body">Exact bytes, signatures,</text>
  <text x="842" y="378" class="body">nonce + backstops</text>
  <text x="32" y="452" class="body">Only the evaluator decodes arguments. The verifier and Vault bind the calldata bytes.</text>
  <path d="M32 473h1016" stroke="#7a91aa"/>
  <text x="32" y="509" class="label">ALLOW</text>
  <text x="102" y="509" class="body">Automatic path*</text>
  <text x="371" y="509" class="label">REVIEW</text>
  <text x="452" y="509" class="body">Owner override*</text>
  <text x="745" y="509" class="label">BLOCK</text>
  <text x="819" y="509" class="body">Both paths revert</text>
  <text x="32" y="541" class="body">* Remaining Vault checks must pass. Testnet lab; no cumulative-loss or onchain token-allowance cap.</text>
</svg>
